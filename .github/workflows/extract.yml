name: Extract PawGo web export
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract dist to root
        run: |
          if [ ! -f pawgo-web.zip ]; then echo "no zip, nothing to do"; exit 0; fi
          unzip -o pawgo-web.zip
          ls -la
          if [ -d dist ]; then
            rm -rf _expo assets
            rm -f index.html favicon.ico metadata.json
            shopt -s dotglob; mv dist/* .; rmdir dist || true
          fi
          rm -rf __MACOSX
          rm -f pawgo-web.zip
          rm -rf .github
          ls -la
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Extract PawGo web export (dist/ to root)" || echo "nothing to commit"
          git push
