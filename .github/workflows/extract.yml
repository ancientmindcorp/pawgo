name: Extract pawgo-web.zip
on:
  push:
    branches: [main]
    paths:
      - pawgo-web.zip
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract dist to repo root
        run: |
          if [ ! -f pawgo-web.zip ]; then
            echo "pawgo-web.zip not found, nothing to extract."
            exit 0
          fi
          unzip -o pawgo-web.zip
          ls -la
          if [ -d dist ]; then
            cp -r dist/. .
            rm -rf dist
          fi
          ls -la
      - name: Commit extracted files
        run: |
          git config user.name "ancientmindcorp"
          git config user.email "ancientmindcorp@users.noreply.github.com"
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update PawGo web export"
            git push
          fi
